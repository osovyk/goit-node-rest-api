services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: goit-node-rest-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_SERVICE: ${EMAIL_SERVICE}
      EMAIL: ${EMAIL}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      BASE_URL: ${BASE_URL}
    volumes:
      - avatars:/app/public/avatars
      - tmp:/app/tmp
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  avatars:
  tmp:

networks:
  app-network:
    driver: bridge
